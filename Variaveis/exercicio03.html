<script>
    const produto = Number(prompt("Digite o valor do produto: "))
    alert("Opcoes de pagamento sao: 10% de desconto a vista ou 3x")
    const preco = produto
    const vista = produto * 10/100
    const resul = produto - vista
    const x = produto / 3
    alert("preco R$: " + preco)
    alert("a vista: " + resul)
    alert("3X: " + x)
</script>
