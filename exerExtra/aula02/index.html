<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>prompt e alert</title>
    </head>
    <body>
        <h1>Testando alerts e prompt em Javascript</h1>
        <script>
            alert('Bem vindo ao mundo javascript')
            let nome = prompt('Qual é o seu nome?')
            alert('OLA ' + nome)
        </script>
    </body>
</html>
