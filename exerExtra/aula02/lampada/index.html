<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>JS lampada</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col">
                    <h1>O que o javascript pode fazer?</h1>
                    <p>Javascript pode alterar valores de atributos HTML.</p>
                    <img src="imagens/acesa.jpg" alt="lampada" id="myimage">

                    <buttom class="btn btn-secondary" onclick="document.getElementById('myimage').src='imagens/apagada.jpg'">Apague a luz</buttom>
                    <buttom class="btn btn-secondary" onclick="document.getElementById('myimage').src='imagens/quebrada.jpg'">quebre a luz</buttom>
                    <buttom class="btn btn-secondary" onclick="document.getElementById('myimage').src='imagens/acesa.jpg'">Acenda a luz</buttom>
                </div>
            </div>
        </div>
    </body>
</html>
